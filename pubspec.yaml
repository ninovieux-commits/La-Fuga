name: lafuga
description: La Fuga — jeu de plateau, portage Flutter de l'application Kivy.
publish_to: none
version: 1.0.0+1

environment:
  sdk: ^3.9.0

dependencies:
  flutter:
    sdk: flutter
  http: ^1.2.2
  crypto: ^3.0.6
  socket_io_client: ^3.0.2
  shared_preferences: ^2.3.3
  path_provider: ^2.1.5
  audioplayers: ^6.1.0
  # Notifications push. Pas de google-services.json : les quatre valeurs de
  # l'application sont données au démarrage, comme le fait main.py en Kivy
  # (voir lib/net/firebase_options.dart).
  firebase_core: ^4.15.0
  firebase_messaging: ^16.7.0
  flutter_local_notifications: ^18.0.1
  url_launcher: ^6.3.1
  # LES ENVELOPPES : choisir une photo, et la rendre légère.
  #
  # `image_picker` ouvre l'appareil photo ou la galerie, et REDUIT lui-même
  # l'image avec le décodeur du système : c'est ce qui permet au serveur de
  # ne jamais décoder quoi que ce soit (voir docs/ENVELOPPES.md).
  image_picker: ^1.1.2
  # `image` réencode en JPEG ce que l'éditeur a dessiné : un PNG de 720p
  # pèserait deux mégaoctets là où le JPEG en fait deux cents kilos.
  image: ^4.3.0
  # `gal` range dans la galerie du téléphone l'image qu'on vient de recevoir :
  # « quand on ouvre une image reçue, il y a un bouton télécharger ». C'est le
  # seul endroit où une image quitte l'application pour de bon.
  gal: ^2.3.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  test: ^1.25.8
  # Pour enregistrer l'implémentation Android du greffon de notifications
  # dans les tests : hors appareil, aucune ne l'est, et `show` ne ferait
  # rien du tout — le test passerait quoi qu'il arrive.
  flutter_local_notifications_platform_interface: ^8.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/fonts/
    - assets/i18n/
    - assets/images/
    - assets/logos/
    # Un dossier par instrument, et il FAUT les lister : Flutter ne descend
    # pas dans les sous-dossiers d'une entrée. Quatre instruments ajoutés
    # sans toucher à cette liste, et leurs 112 notes restaient hors de
    # l'APK — muettes, sans la moindre erreur. `instruments_test.dart` le
    # vérifie maintenant.
    - assets/sounds/choeur/
    - assets/sounds/cloche/
    - assets/sounds/guitare/
    - assets/sounds/harpe/
    - assets/sounds/orgue/
    - assets/sounds/piano/
    - assets/sounds/xylophone/
    - assets/instruments/
    - assets/themes/theme_deepgrey/
    - assets/themes/themebataille/
    - assets/themes/themedragon/
    - assets/themes/themefleurs/
    - assets/themes/themeinsectes/
  fonts:
    - family: NotoSansCJK
      fonts:
        - asset: assets/fonts/NotoSansCJKsc-Regular.otf
