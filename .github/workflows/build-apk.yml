name: Compiler l'APK Android

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:
    inputs:
      debug:
        description: "Compiler en mode debug (pour diagnostiquer, JAMAIS pour jouer)"
        type: boolean
        default: false

# Sur une pull request, un nouveau push annule le build précédent : seul le
# dernier état compte. Sur main en revanche, chaque commit garde son APK —
# annuler ferait perdre l'artefact d'un commit déjà poussé.
#
# Le tri se fait par le NOM du groupe, pas par cancel-in-progress : une
# expression y renvoyant « false » annulait quand même (deux builds de main
# l'ont été). Hors pull request, le groupe porte donc le numéro du run, donc
# il est unique, donc il n'y a jamais rien à annuler.
concurrency:
  group: apk-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: "3.35.5"

jobs:
  # ── Étage 1 : vérifications rapides. Inutile de compiler un APK si le
  # moteur de règles est cassé : ce job échoue en ~2 min au lieu de ~15.
  verifier:
    name: Analyse et tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Récupérer les dépendances
        run: flutter pub get

      - name: Vérifier le formatage
        run: dart format --output=none --set-exit-if-changed lib test

      - name: Analyse statique
        run: flutter analyze --no-fatal-infos

      - name: Tests (dont la fidélité du moteur au moteur Python)
        run: flutter test --reporter expanded

  build-android:
    name: APK Android
    runs-on: ubuntu-latest
    needs: verifier
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: Installer Java (JDK 17)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Récupérer les dépendances
        run: flutter pub get

      # RELEASE PAR DÉFAUT. Un APK debug fait tourner Dart en JIT, assertions
      # comprises, et le moteur de rendu sans ses raccourcis : l'IA réfléchit
      # plusieurs fois plus longtemps, les animations sautent et le toucher
      # traîne. Ce n'est pas l'application qu'on veut juger. Le mode debug
      # reste accessible à la main, pour diagnostiquer.
      # Chaque APK porte le commit dont il sort — dans le nom de l'artefact,
      # dans le nom du fichier, et dans la version que montre Android
      # (Réglages › Applications › La Fuga). Sans ça tous les
      # téléchargements s'appellent « lafuga-apk-release » et rien ne
      # distingue le build qui porte un correctif de celui qui le précède :
      # on a perdu trois échanges à chercher un bug dans un APK trop vieux
      # pour le contenir.
      - name: Compiler l'APK
        id: build
        run: |
          COURT="$(echo "${{ github.sha }}" | cut -c1-7)"
          # La version doit rester un « x.y.z » valide pour Flutter : le
          # commit part en suffixe de pré-version, ce que semver autorise.
          BASE="$(grep '^version:' pubspec.yaml | cut -d' ' -f2 | cut -d'+' -f1)"
          if [ "${{ inputs.debug }}" = "true" ]; then
            echo "Mode debug — à ne pas utiliser pour juger la fluidité"
            MODE=debug
          else
            echo "Mode release"
            MODE=release
          fi
          flutter build apk --"$MODE" --target-platform android-arm64 \
            --build-name="$BASE-$COURT" --build-number="${{ github.run_number }}"
          SORTIE="build/app/outputs/flutter-apk/app-$MODE.apk"
          FINAL="build/app/outputs/flutter-apk/lafuga-$MODE-$COURT.apk"
          mv "$SORTIE" "$FINAL"
          echo "apk=$FINAL" >> "$GITHUB_OUTPUT"
          echo "nom=lafuga-apk-$MODE-$COURT" >> "$GITHUB_OUTPUT"
          echo "version=$BASE-$COURT ($MODE, build ${{ github.run_number }})" >> "$GITHUB_OUTPUT"

      - name: Récapitulatif
        if: always()
        run: |
          APK="${{ steps.build.outputs.apk }}"
          if [ -f "$APK" ]; then
            TAILLE=$(du -h "$APK" | cut -f1)
            echo "### APK compilé" >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "- Fichier : \`$APK\`" >> "$GITHUB_STEP_SUMMARY"
            echo "- Taille : **$TAILLE**" >> "$GITHUB_STEP_SUMMARY"
            echo "- Commit : \`${{ github.sha }}\`" >> "$GITHUB_STEP_SUMMARY"
            echo "- Version affichée par Android : **${{ steps.build.outputs.version }}**" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "### APK introuvable" >> "$GITHUB_STEP_SUMMARY"
            echo "Attendu à \`$APK\`" >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

      # Sans le garde, un build échoué enverrait un chemin vide à
      # upload-artifact ; c'est le récapitulatif qui fait échouer le job.
      - name: Publier l'APK
        if: always() && steps.build.outputs.apk != ''
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.build.outputs.nom || 'lafuga-apk' }}
          path: ${{ steps.build.outputs.apk }}
          if-no-files-found: error
          retention-days: 30
