name: Préparer la publication (AAB signé)

# À LA MAIN, ET SEULEMENT À LA MAIN. Ce n'est pas une compilation de
# vérification — c'est le fichier qu'on dépose sur le Play Store. On le
# demande quand on veut publier, pas à chaque commit.
on:
  workflow_dispatch:
    inputs:
      note:
        description: "Ce que cette version apporte (pour le récapitulatif)"
        type: string
        default: ""

permissions:
  # `gh release` attache le bundle à une publication du dépôt : un lien
  # direct, sans archive à décompresser sur un téléphone.
  contents: write

env:
  FLUTTER_VERSION: "3.35.5"

jobs:
  aab:
    name: Bundle Android signé
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Récupérer les dépendances
        run: flutter pub get

      # LA CLÉ N'EXISTE QUE LE TEMPS DU BUILD. Elle arrive des secrets du
      # dépôt, s'écrit hors de l'arborescence suivie par git, et part avec la
      # machine. Sans elle, on s'arrête ici plutôt que de produire un bundle
      # signé par la clé de debug, que Google refuserait de toute façon.
      - name: Poser la clé de signature
        env:
          CLE: ${{ secrets.CLE_SIGNATURE_BASE64 }}
          MDP: ${{ secrets.CLE_SIGNATURE_MDP }}
          ALIAS: ${{ secrets.CLE_SIGNATURE_ALIAS }}
        run: |
          if [ -z "$CLE" ] || [ -z "$MDP" ] || [ -z "$ALIAS" ]; then
            echo "::error::Les secrets CLE_SIGNATURE_BASE64, CLE_SIGNATURE_MDP et CLE_SIGNATURE_ALIAS doivent être posés. Voir outils/cle_de_signature.sh."
            exit 1
          fi
          echo "$CLE" | base64 -d > "$RUNNER_TEMP/lafuga-upload.jks"
          cat > android/key.properties <<EOF
          storeFile=$RUNNER_TEMP/lafuga-upload.jks
          storePassword=$MDP
          keyPassword=$MDP
          keyAlias=$ALIAS
          EOF

      # LE NUMÉRO DE BUILD NE RECULE JAMAIS : Google refuse un bundle dont le
      # numéro n'est pas supérieur au précédent. `run_number` est commun à
      # tous les ateliers du dépôt, donc il ne fait que monter.
      - name: Compiler le bundle
        id: build
        run: |
          BASE="$(grep '^version:' pubspec.yaml | cut -d' ' -f2 | cut -d'+' -f1)"
          flutter build appbundle --release \
            --build-name="$BASE" --build-number="${{ github.run_number }}"
          echo "aab=build/app/outputs/bundle/release/app-release.aab" >> "$GITHUB_OUTPUT"
          echo "version=$BASE (build ${{ github.run_number }})" >> "$GITHUB_OUTPUT"

      - name: Ranger la clé
        if: always()
        run: rm -f android/key.properties "$RUNNER_TEMP/lafuga-upload.jks"

      # QUI A SIGNÉ, EXACTEMENT. La première version cherchait « Android
      # Debug » dans `META-INF/*.RSA` : si le motif ne désignait aucun
      # fichier, elle ne trouvait rien et laissait donc passer n'importe
      # quoi — un contrôle qui ne peut qu'approuver n'en est pas un. On
      # trouve ici le fichier de signature quel qu'il soit, on exige qu'il
      # existe, et on écrit l'empreinte du certificat : c'est elle que
      # Google montrera au dépôt, et elle doit être la même à chaque fois.
      - name: Vérifier la signature
        run: |
          AAB="${{ steps.build.outputs.aab }}"
          SIG="$(unzip -l "$AAB" | grep -oE 'META-INF/[^ ]+\.(RSA|DSA|EC)$' | head -1)"
          if [ -z "$SIG" ]; then
            echo "::error::Ce bundle ne porte aucune signature."
            exit 1
          fi
          CERT="$(unzip -p "$AAB" "$SIG" | keytool -printcert)"
          echo "$CERT"
          if echo "$CERT" | grep -q "Android Debug"; then
            echo "::error::Ce bundle est signé par la clé de DEBUG. Il ne peut pas être publié."
            exit 1
          fi
          EMPREINTE="$(echo "$CERT" | grep -i 'SHA256:' | head -1 | sed 's/.*SHA256: *//')"
          PROPRIETAIRE="$(echo "$CERT" | grep -i '^Owner:' | head -1 | sed 's/^[Oo]wner: *//')"
          echo "empreinte=$EMPREINTE" >> "$GITHUB_OUTPUT"
          echo "### Bundle prêt" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "- Version : **${{ steps.build.outputs.version }}**" >> "$GITHUB_STEP_SUMMARY"
          echo "- Taille : **$(du -h "$AAB" | cut -f1)**" >> "$GITHUB_STEP_SUMMARY"
          echo "- Commit : \`${{ github.sha }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- Note : ${{ inputs.note }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- Signé par : \`$PROPRIETAIRE\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- Empreinte SHA-256 : \`$EMPREINTE\`" >> "$GITHUB_STEP_SUMMARY"

      - name: Publier le bundle
        uses: actions/upload-artifact@v4
        with:
          name: lafuga-aab-${{ github.run_number }}
          path: ${{ steps.build.outputs.aab }}
          if-no-files-found: error
          retention-days: 90

      # ET UN LIEN DIRECT. L'artefact ci-dessus arrive dans une archive zip,
      # qu'il faut ouvrir avant de pouvoir déposer le bundle sur le Play
      # Store — pénible depuis un téléphone. La publication, elle, offre le
      # fichier tel quel.
      - name: Attacher le bundle à une publication
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          AAB="${{ steps.build.outputs.aab }}"
          NOM="lafuga-${{ github.run_number }}.aab"
          cp "$AAB" "$NOM"
          gh release create "bundle-${{ github.run_number }}" "$NOM" \
            --title "Bundle ${{ steps.build.outputs.version }}" \
            --notes "Bundle Android signé, prêt à déposer sur le Play Store.

          Commit : ${{ github.sha }}
          ${{ inputs.note }}" \
            --latest=false
          echo "- Téléchargement : $(gh release view "bundle-${{ github.run_number }}" --json url --jq .url)" >> "$GITHUB_STEP_SUMMARY"
